plugins {
    id("net.fabricmc.fabric-loom") version "1.16.3"
    id("com.gradleup.shadow") version "9.6.1"
}

group = "me.pikamug.quests"
version = "5.3.3"

base {
    archivesName = "Quests-Fabric"
}

// Minecraft 26.1+ is unobfuscated, so the non-remapping fabric-loom plugin is used:
// no mappings are needed and the game classes compile against their official names.

configurations {
    shaded
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://libraries.minecraft.net/" }
    maven { url = "https://jitpack.io" }
    maven { url = "https://maven.nucleoid.xyz/" }
    maven { url = "https://chocolateminecraft.com/maven/" }
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft("com.mojang:minecraft:26.2")
    implementation("net.fabricmc:fabric-loader:0.19.2")

    // YAWP (Yet Another World Protector) via Modrinth's public Maven.
    implementation("maven.modrinth:yawp:26.1.2-0.6.3-beta3")

    // Hosted by their respective mods at runtime; compile-only here.
    compileOnly("net.luckperms:api:5.5")
    compileOnly("me.lucko:fabric-permissions-api:0.3.3")
    compileOnly("eu.pb4:placeholder-api:3.0.0+26.1")
    compileOnly("xaero.pac:open-parties-and-claims-fabric-26.1.2:0.30.3") {
        transitive = false
    }

    // Bundled (and relocated) into the final jar.
    shaded(project(":api"))
    shaded("com.github.Browsit.ConversationAPI:conversation-api:3ad4823656")
    shaded("com.github.Browsit.ConversationAPI:conversation-impl:3ad4823656")

    // ConversationAPI-Fabric adapter: provides MinecraftServer audiences for the Conversations API and
    // the chat-forwarding mixin, for parity with how the Bukkit module shades conversation-bukkit.
    // Requires the upstream 26.2 port to be published; transitive deps are supplied explicitly below.
    shaded("com.github.Browsit.ConversationAPI-Fabric:fabricConversationsMod:master-SNAPSHOT") {
        transitive = false
    }
    // AudienceProvider bridge that FabricServerAudiences.of(server) needs. Pin to the MC 26.2 build.
    shaded("net.kyori:adventure-platform-fabric:5.10.1") {
        transitive = false
    }
}

// The shaded libraries are needed on the compile classpath but only bundled via shadowJar.
sourceSets.main.compileClasspath += configurations.shaded

processResources {
    inputs.property("version", project.version)
    filesMatching("fabric.mod.json") {
        expand("version": project.version)
    }
}

java {
    // Built against Java 25. The JDK is auto-provisioned through the Foojay resolver registered in
    // settings.gradle, so no machine-specific JAVA_HOME/local JDK directory is required.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
    options.compilerArgs.add("-proc:none")
}

// The distributable mod jar is the shadowed jar; the plain jar is kept as a slim variant.
shadowJar {
    archiveClassifier.set("")
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    // Add shaded jars by hand so their mod metadata can be stripped: a bundled mod's fabric.mod.json,
    // mixin descriptors and access wideners must not leak into Quests' own metadata.
    configurations = []
    from(project.configurations.shaded) {
        exclude("fabric.mod.json")
        exclude("*mixins*.json")
        exclude("*.accesswidener")
    }
    relocate("org.browsit.conversations", "me.pikamug.quests.libs.conversations")
    relocate("net.kyori.adventure.platform.fabric", "me.pikamug.quests.libs.adventure.platform.fabric")
    relocate("com.zaxxer.hikari", "me.pikamug.quests.libs.hikari")
    relocate("com.mysql", "me.pikamug.quests.libs.mysql")
    exclude("META-INF/*.MF")
    exclude("LICENSE")
    exclude("module-info.class")
    dependencies {
        exclude(dependency("org.jetbrains:annotations"))
    }
    mergeServiceFiles()
}

tasks.jar {
    archiveClassifier.set("slim")
}

tasks.build {
    dependsOn(shadowJar)
}