plugins {
    id("net.fabricmc.fabric-loom") version "1.16.3"
    id("com.gradleup.shadow") version "9.6.1"
}

group = "me.pikamug.quests"
version = "5.3.3"

base {
    archivesName = "Quests-Fabric"
}

// Minecraft 26.1+ is unobfuscated, so the non-remapping fabric-loom plugin is used:
// no mappings are needed and the game classes compile against their official names.

configurations {
    shaded
    bundledMods
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://libraries.minecraft.net/" }
    maven { url = "https://jitpack.io" }
    maven { url = "https://maven.nucleoid.xyz/" }
    maven { url = "https://chocolateminecraft.com/maven/" }
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft("com.mojang:minecraft:26.2")
    implementation("net.fabricmc:fabric-loader:0.19.2")

    // YAWP (Yet Another World Protector) via Modrinth's public Maven.
    implementation("maven.modrinth:yawp:26.1.2-0.6.3-beta3")

    // Hosted by their respective mods at runtime; compile-only here.
    compileOnly("net.luckperms:api:5.5")
    compileOnly("me.lucko:fabric-permissions-api:0.3.3")
    compileOnly("eu.pb4:placeholder-api:3.0.0+26.1")
    compileOnly("xaero.pac:open-parties-and-claims-fabric-26.1.2:0.30.3") {
        transitive = false
    }

    // Bundled (and relocated) into the final jar.
    shaded(project(":api"))

    // ConversationAPI-Fabric adapter, embedded in the Quests jar as a loader-registered nested mod
    // (fabric.mod.json "jars"), so net.kyori* adventure stays owned by that project rather than being
    // re-homed into Quests. Normal users install only Quests; the loader announces both it and the
    // adventure-platform-fabric mod that accompanies it. (JitPack pin restored after the TEMP LOCAL
    // TEST below is verified: com.github.Browsit:ConversationAPI-Fabric:<sha>, transitive=false so
    // the adapter's POM runtime deps stay off the classpath and out of META-INF/jars.) The adapter
    // TEMP LOCAL TEST: verify the ChatMessageMixin @Shadow fix before pushing upstream.
    def conversationFabricJar = file("../../ConversationAPI-Fabric/build/libs/fabricConversationsMod-1.0-SNAPSHOT.jar")
    compileOnly(files(conversationFabricJar))
    bundledMods(files(conversationFabricJar))
    // The adapter jar nests api in META-INF/jars, which javac does not unpack, so the API itself is
    // declared separately (JitPack "com.github.Browsit.ConversationAPI"). Compile-only: at runtime
    // those classes come from the embedded conversation-fabric mod.
    compileOnly("com.github.Browsit.ConversationAPI:api:909d27ea60") {
        transitive = false
    }
    // conversation-api's public methods (e.g. TimeClause.create, title, prompt) expose net.kyori
    // adventure types in their signatures, so javac needs adventure-api purely to resolve those
    // overloads. Compile-only: adventure is never bundled here - it arrives at runtime from the
    // embedded adventure-platform-fabric mod (see "jars" in the adapter's fabric.mod.json).
    compileOnly("net.kyori:adventure-api:4.17.0") {
        transitive = false
    }
}

// The shaded libraries are needed on the compile classpath but only bundled via shadowJar.
sourceSets.main.compileClasspath += configurations.shaded

processResources {
    inputs.property("version", project.version)
    filesMatching("fabric.mod.json") {
        // Plain token replacement: the Groovy template engine treats "$" in inner-class names
        // like "Sound$Emitter" as a property reference, so "expand" can't be used here.
        filter { line -> line.replace("\${version}", project.version as String) }
    }
}

java {
    // Built against Java 25. The JDK is auto-provisioned through the Foojay resolver registered in
    // settings.gradle, so no machine-specific JAVA_HOME/local JDK directory is required.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
    options.compilerArgs.add("-proc:none")
}

// The distributable mod jar is the shadowed jar; the plain jar is kept as a slim variant.
shadowJar {
    archiveClassifier.set("")
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    // Add shaded jars by hand so their mod metadata can be stripped: a bundled mod's fabric.mod.json,
    // mixin descriptors and access wideners must not leak into Quests' own metadata. Each shaded jar is
    // expanded into a file tree so its classes are merged (and relocated) instead of nested whole.
    configurations = []
    from({
        project.configurations.shaded.collect { zipTree(it) }
    }) {
        exclude("fabric.mod.json")
        exclude("*mixins*.json")
        exclude("*.accesswidener")
        exclude("org/jetbrains/annotations/**")
    }
    relocate("com.zaxxer.hikari", "me.pikamug.quests.libs.hikari")
    relocate("com.mysql", "me.pikamug.quests.libs.mysql")
    exclude("META-INF/*.MF")
    exclude("LICENSE")
    exclude("module-info.class")
    mergeServiceFiles()
    // Nested loader-registered mods (see "jars" in fabric.mod.json): conversation-fabric and the
    // adventure-platform-fabric it depends on, copied verbatim so each keeps its own fabric.mod.json.
    into("META-INF/jars") {
        from(project.configurations.bundledMods)
        // Rename the bundled mods to stable filenames so fabric.mod.json's "jars" entries do not
        // depend on the upstream artifact's own name/version (e.g. JitPack "ConversationAPI-Fabric-<sha>.jar").
        rename { name ->
            if (name.startsWith("ConversationAPI-Fabric") || name.startsWith("fabricConversationsMod")) "conversation-fabric.jar"
            else if (name.startsWith("adventure-platform-fabric")) "adventure-platform-fabric.jar"
            else name
        }
    }
}

tasks.jar {
    archiveClassifier.set("slim")
}

tasks.build {
    dependsOn(shadowJar)
}