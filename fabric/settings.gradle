pluginManagement {
    repositories {
        maven { name = "Fabric"; url = "https://maven.fabricmc.net/" }
        gradlePluginPortal()
        mavenCentral()
    }
}

// Auto-provisions missing JDK toolchains (e.g. the Java 25 toolchain declared in build.gradle)
// via the foojay Disco API, so the build does not depend on any machine-specific JAVA_HOME path.
plugins {
    id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        maven { name = "Fabric"; url = "https://maven.fabricmc.net/" }
        maven { name = "Mojang"; url = "https://libraries.minecraft.net/" }
        maven { name = "JitPack"; url = "https://jitpack.io" }
        maven { name = "Nucleoid"; url = "https://maven.nucleoid.xyz/" }
        maven { name = "ChocolateMinecraft"; url = "https://chocolateminecraft.com/maven/" }
        maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
    }
}

rootProject.name = "quests"

// The fabric module's build (this project) compiles against the api sources as a sibling module.
includeFlat("api")